# FanControl.DeepCoolDigital settings
# Place this file next to FanControl.DeepCoolDigital.dll (FanControl Plugins folder).
# Changes are picked up automatically within a few seconds,
# except vendorId/productId which require a FanControl restart.
#
# Display mode: temp | usage | dynamic
#   temp    = CPU temperature only
#   usage   = CPU usage only
#   dynamic = alternates between temperature and usage,
#             the same as DeepCool Hub "Dynamic mode"
mode=temp
# Seconds between temperature and usage when mode=dynamic
autoSwitchSeconds=5
# High-temperature alarm on the cooler when the CPU temperature exceeds this value (Celsius)
alarmTemperature=90
# Enable the high-temperature alarm (DeepCool Hub "Warning Control")
alarmEnabled=true
# Show temperatures in Fahrenheit on devices that support it (e.g. the AK series)
fahrenheit=false
# USB ids of the primary display target (AG620 Digital defaults)
vendorId=0x3633
productId=0x0008
# Log file next to the plugin dll: off | events | verbose
# (the legacy key log=true maps to events)
logLevel=off
# CPU temperature sensor priority, pipe separated (default: CPU Package, Core (Tctl/Tdie), ...)
# preferredTempSensors=CPU Package|Core (Tctl/Tdie)
#
# Optional per-device overrides, for example:
# [device:0x3633:0x0002]
# mode=usage
# alarmTemperature=85
# alarmEnabled=false
# fahrenheit=true
