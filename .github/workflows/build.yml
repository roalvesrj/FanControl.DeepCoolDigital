name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FanControl.DeepCoolDigital.sln

      - name: Build
        run: dotnet build FanControl.DeepCoolDigital.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FanControl.DeepCoolDigital.Tests/FanControl.DeepCoolDigital.Tests.csproj -c Release --no-build

      - name: Probe CLI smoke (graceful IPC failure expected on CI)
        shell: pwsh
        run: |
          $output = & .\tools\DeepCoolDigitalProbe\bin\Release\DeepCoolDigitalProbe.exe sensors --timeout 250 2>&1 | Out-String
          Write-Host $output
          if ($output -match 'Could not load file or assembly|FileLoadException|TypeLoadException|FileNotFoundException|initializer|inicializador') {
            Write-Error "Probe failed to load its dependencies: $output"
            exit 1
          }
          if ($output -notmatch 'unavailable|Access denied|acesso negado') {
            Write-Error "Probe did not fail gracefully: $output"
            exit 1
          }
          exit 0

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FanControl.DeepCoolDigital
          path: |
            src/FanControl.DeepCoolDigital/bin/Release/FanControl.DeepCoolDigital.dll
            src/FanControl.DeepCoolDigital/bin/Release/FanControl.DeepCoolDigital.Core.dll
            src/FanControl.DeepCoolDigital/bin/Release/DeepCoolDigital.ini
